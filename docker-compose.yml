services:

  # ── Base de datos PostgreSQL ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-gestion_cxc}
      POSTGRES_USER:     ${POSTGRES_USER:-gestion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Solo accesible desde localhost — no expuesto a la red local.
      # Para conectar con DBeaver/pgAdmin usa host=127.0.0.1 puerto=5432.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestion_user} -d ${POSTGRES_DB:-gestion_cxc}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Aplicación FastAPI ────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      # Sobreescribe DATABASE_URL del .env para apuntar al servicio 'db'
      DATABASE_URL: postgresql://${POSTGRES_USER:-gestion_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gestion_cxc}
    depends_on:
      db:
        condition: service_healthy
    develop:
      # Hot-reload del código fuente en desarrollo
      watch:
        - action: sync+restart
          path: ./backend
          target: /app/backend
        - action: sync+restart
          path: ./frontend
          target: /app/frontend


volumes:
  postgres_data:
    driver: local
