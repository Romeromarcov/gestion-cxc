[pytest]
testpaths = tests
asyncio_mode = auto
# Muestra las razones de skip y los warnings de deprecación
addopts = -v --tb=short
# Ignora warnings de psycopg2 (no instalado en el entorno de test)
filterwarnings =
    ignore::DeprecationWarning:psycopg2
    ignore::DeprecationWarning:pkg_resources
